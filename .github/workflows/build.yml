name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Launcher-X end to end in real Windows PowerShell (git clone / pull / build / run).
      - run: node test-launcherx.js
      # Writes latest*.yml next to installers; the app's auto-updater reads them from the GitHub Release.
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: mod-manager-windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error

  # Runs on a v* tag push, or manually (Actions → Build → Run workflow), tagging v<package.json version>.
  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
