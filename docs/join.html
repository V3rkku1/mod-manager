<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mod Manager invite</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #313338; color: #dbdee1; font: 15px/1.5 "Segoe UI", system-ui, sans-serif; }
  main { max-width: 420px; padding: 24px 16px; text-align: center; display: grid; gap: 14px; }
  h1 { color: #f2f3f5; font-size: 22px; margin: 0; }
  a.btn { display: block; padding: 12px; border-radius: 6px; background: #5865f2; color: #fff; text-decoration: none; font-weight: 600; }
  a.alt { background: #4e5058; }
  p { color: #949ba4; margin: 0; }
</style>
</head>
<body>
<main>
  <h1>Your friend shared a mod profile</h1>
  <p>Opening Mod Manager… If nothing happens, use the button below.</p>
  <a class="btn" id="open" href="#">Open in Mod Manager</a>
  <a class="btn alt" href="https://github.com/V3rkku1/mod-manager/releases/latest">Don't have it? Download Mod Manager</a>
</main>
<script>
  // #import/<code> or #follow/<gist id> -> modmanager://… (only these two forms are passed on)
  const m = location.hash.slice(1).match(/^(import|follow)\/([\w-]+)$/)
  const url = m ? `modmanager://${m[1]}/${m[2]}` : null
  if (url) { document.getElementById('open').href = url; location.href = url }
  else document.querySelector('p').textContent = 'This invite link is incomplete.'
</script>
</body>
</html>
